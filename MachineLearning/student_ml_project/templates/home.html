<!DOCTYPE html>
<html>

<head>
    <title>Student Performance Prediction</title>
</head>

<body>

    <h1>🎓 Student Performance Prediction System</h1>

    <form method="POST">

        {% csrf_token %}

        <label>Hours Studied</label><br>
        <input type="number" name="hours" required><br><br>

        <label>Attendance</label><br>
        <input type="number" name="attendance" required><br><br>

        <label>Previous Score</label><br>
        <input type="number" name="previous_score" required><br><br>

        <button type="submit">
            Predict
        </button>

    </form>

    <hr>

    {% if prediction %}

    <h2>
        Predicted Final Score : {{ prediction }}
    </h2>

    {% endif %}

</body>

</html>
